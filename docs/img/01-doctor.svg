<svg xmlns="http://www.w3.org/2000/svg" width="980" height="897" viewBox="0 0 980 897">
  <rect width="980" height="897" fill="#0b1220"/>
  <text x="40" y="46" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="26" font-weight="700" fill="#f0f6fc">ipp doctor：一份体检报告</text>
  <text x="40" y="76" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="16" fill="#8b949e">示例值全部虚构（203.0.113.0/24 为文档专用网段）</text>
  <rect x="24" y="112" width="932" height="761" rx="12" fill="#0c0f16" stroke="#24324a"/>
  <rect x="24" y="112" width="932" height="30" rx="12" fill="#161b22"/>
  <circle cx="46" cy="127" r="6" fill="#ff5f56"/>
  <circle cx="64" cy="127" r="6" fill="#ffbd2e"/>
  <circle cx="82" cy="127" r="6" fill="#27c93f"/>
  <text x="48" y="176" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#3fb950">$ ipp doctor</text>
  <text x="48" y="230" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#39c5cf">▸ 出口身份</text>
  <text x="48" y="257" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#c9d1d9">  IP            203.0.113.42</text>
  <text x="48" y="284" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#c9d1d9">  ASN           AS64500 Example Telecom</text>
  <text x="48" y="311" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#c9d1d9">  reverse DNS   203-0-113-42.dynamic.example.net</text>
  <text x="48" y="338" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#3fb950">  ✅ 欺诈评分    0 / 100</text>
  <text x="48" y="365" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#3fb950">  ✅ 网络类型    住宅/家宽</text>
  <text x="48" y="392" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#3fb950">  ✅ 出口 geo    NL</text>
  <text x="48" y="446" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#39c5cf">▸ 解析路径</text>
  <text x="48" y="473" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#3fb950">  ✅ claude.ai           198.18.0.23 (fake-ip)</text>
  <text x="48" y="500" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#3fb950">  ✅ api.anthropic.com   198.18.0.24 (fake-ip)</text>
  <text x="48" y="554" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#39c5cf">▸ 出口收敛</text>
  <text x="48" y="581" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#3fb950">  ✅ 结论  AI 域名已收敛至单一策略组</text>
  <text x="48" y="635" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#39c5cf">▸ 环境一致性（时区 / 语言 / geo）</text>
  <text x="48" y="662" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#3fb950">  ✅ 时区对齐  Europe/Amsterdam</text>
  <text x="48" y="689" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#3fb950">  ✅ 地区对齐  en_NL</text>
  <text x="48" y="743" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#39c5cf">▸ 链路与熔断器</text>
  <text x="48" y="770" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#3fb950">  ✅ 熔断器 已加载      ✅ 豁免标记 无</text>
  <text x="48" y="824" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#8b949e">──────────────────────────────────────</text>
  <text x="48" y="851" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#3fb950">  全部通过</text>
</svg>
